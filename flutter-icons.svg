<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="540" height="230" viewBox="0 0 540 230">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 10px;
      font-weight: bold;
      fill: #0468d7;
      text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.2);
    }
    rect {
      rx: 10;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      fill: #0468d7;
      text-anchor: middle;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 12px;
      fill: #555;
      text-anchor: middle;
      font-style: italic;
    }
  </style>
  
  <rect x="120" y="10" width="300" height="40" rx="20" fill="#f0f9ff" stroke="#0468d7" stroke-width="2" />
  <text x="270" y="35" class="title">Flutter Ecosystem</text>
  <!-- Decorative elements -->
  <path d="M110 30 L130 30" stroke="#0468d7" stroke-width="2" />
  <path d="M410 30 L430 30" stroke="#0468d7" stroke-width="2" />
  <circle cx="110" cy="30" r="3" fill="#0468d7" />
  <circle cx="430" cy="30" r="3" fill="#0468d7" />
  
  <!-- Flutter logo -->
  <g transform="translate(10, 70)">
    <rect width="50" height="50" fill="#0468d7" />
    <path d="M15 25 L25 15 L40 15 L25 30 L40 45 L30 45 L15 30 Z" fill="white" />
    <path d="M25 30 L40 15 L40 25 L32.5 32.5 Z" fill="#47c5fb" />
    <path d="M25 30 L32.5 32.5 L40 25 L40 45 L25 45 Z" fill="#00569e" />
  </g>
  
  <!-- Dart logo -->
  <g transform="translate(70, 70)">
    <rect width="50" height="50" fill="#0175c2" />
    <path d="M30 15 L40 15 L30 25 L20 35 L15 40 L15 30 Z" fill="white" />
    <path d="M30 15 L30 25 L20 35 L15 30 L15 20 Z" fill="#00c4b3" />
  </g>
  
  <!-- Firebase logo -->
  <g transform="translate(130, 70)">
    <rect width="50" height="50" fill="#ffca28" />
    <path d="M15 35 L20 15 L30 30 Z" fill="#ffa000" />
    <path d="M15 35 L30 30 L40 15 L35 40 Z" fill="#f57c00" />
  </g>
  
  <!-- Postman logo -->
  <g transform="translate(190, 70)">
    <rect width="50" height="50" fill="#ff6c37" />
    <circle cx="25" cy="25" r="12" fill="white" />
    <circle cx="25" cy="25" r="6" fill="#ff6c37" />
  </g>
  
  <!-- FlutterFlow logo -->
  <g transform="translate(250, 70)">
    <rect width="50" height="50" fill="#0057FF" />
    <path d="M15 25 L25 15 L35 25 L25 35 Z" fill="white" />
    <path d="M25 15 L35 25 L25 35 L15 25 L25 15 M28 28 L32 32 L38 26 L34 22 Z" fill="#00C7FE" />
  </g>
  
  <!-- Provider logo -->
  <g transform="translate(310, 70)">
    <rect width="50" height="50" fill="#4CAF50" />
    <path d="M20 25 C20 22, 22 20, 25 20 C28 20, 30 22, 30 25 C30 28, 28 30, 25 30 C22 30, 20 28, 20 25 Z" fill="white" />
    <path d="M15 15 L35 15 L35 35 L15 35 Z" fill="none" stroke="white" stroke-width="2" />
    <path d="M15 15 L35 35 M15 35 L35 15" fill="none" stroke="white" stroke-width="2" />
  </g>
  
  <!-- GetX logo -->
  <g transform="translate(370, 70)">
    <rect width="50" height="50" fill="#8A2BE2" />
    <text x="25" y="35" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="24" fill="white">G</text>
    <text x="32" y="30" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="white">X</text>
  </g>
  
  <!-- Flutter Hooks logo -->
  <g transform="translate(430, 70)">
    <rect width="50" height="50" fill="#00B0FF" />
    <path d="M25 15 C18 15, 15 18, 15 25 C15 32, 18 35, 25 35 C32 35, 35 32, 35 25" fill="none" stroke="white" stroke-width="2" />
    <circle cx="35" cy="25" r="3" fill="white" />
  </g>
  
  <!-- Dio logo -->
  <g transform="translate(490, 70)">
    <rect width="50" height="50" fill="#1976D2" />
    <path d="M20 20 C20 20, 25 15, 30 20 C35 25, 30 35, 25 35 C20 35, 15 30, 20 25 Z" fill="white" />
    <path d="M30 25 L40 20 L40 30 Z" fill="white" />
  </g>

  <!-- Labels with text highlights -->
  <text x="35" y="135" text-anchor="middle">Flutter</text>
  <text x="95" y="135" text-anchor="middle">Dart</text>
  <text x="155" y="135" text-anchor="middle">Firebase</text>
  <text x="215" y="135" text-anchor="middle">Postman</text>
  <text x="275" y="135" text-anchor="middle">FlutterFlow</text>
  <text x="335" y="135" text-anchor="middle">Provider</text>
  <text x="395" y="135" text-anchor="middle">GetX</text>
  <text x="455" y="135" text-anchor="middle">Hooks</text>
  <text x="515" y="135" text-anchor="middle">Dio</text>

  <!-- BLoC -->
  <g transform="translate(10, 150)">
    <rect width="50" height="50" fill="#137CBD" />
    <path d="M15 20 L15 40 L35 40 L35 20 Z" fill="none" stroke="white" stroke-width="2" />
    <path d="M20 25 L30 25 M20 30 L30 30 M20 35 L30 35" fill="none" stroke="white" stroke-width="2" />
    <path d="M25 15 L25 45" fill="none" stroke="white" stroke-width="2" />
  </g>

  <!-- Cubit -->
  <g transform="translate(70, 150)">
    <rect width="50" height="50" fill="#00ACC1" />
    <rect x="15" y="20" width="20" height="20" rx="3" fill="none" stroke="white" stroke-width="2" />
    <path d="M20 25 L30 25 M20 30 L30 30" fill="none" stroke="white" stroke-width="2" />
    <path d="M25 15 L25 40" fill="none" stroke="white" stroke-width="2" />
  </g>

  <!-- Riverpod -->
  <g transform="translate(130, 150)">
    <rect width="50" height="50" fill="#0288D1" />
    <path d="M20 20 L30 20 L25 30 Z" fill="white" />
    <path d="M20 30 L30 30 L25 20 Z" fill="white" />
  </g>

  <!-- Supabase logo -->
  <g transform="translate(190, 150)">
    <rect width="50" height="50" fill="#3ECF8E" />
    <path d="M30 20 L35 35 L25 35 Z" fill="white" />
    <path d="M20 20 L25 35 L15 35 Z" fill="white" />
    <rect x="15" y="18" width="20" height="3" fill="white" rx="1" />
    <path d="M15 25 L35 25" fill="none" stroke="white" stroke-width="1.5" />
    <path d="M15 30 L35 30" fill="none" stroke="white" stroke-width="1.5" />
  </g>

  <!-- Hive -->
  <g transform="translate(250, 150)">
    <rect width="50" height="50" fill="#F9A825" />
    <path d="M20 20 L30 15 L40 20 L40 30 L30 35 L20 30 Z" fill="white" />
    <circle cx="30" cy="25" r="3" fill="#F9A825" />
  </g>

  <!-- Retrofit -->
  <g transform="translate(310, 150)">
    <rect width="50" height="50" fill="#D32F2F" />
    <path d="M15 20 L35 20 L35 40 L25 40 L25 35 L15 35 Z" fill="white" />
    <path d="M20 25 L30 25 M20 30 L30 30" fill="none" stroke="#D32F2F" stroke-width="2" />
    <path d="M35 20 L35 15 L25 15 L25 25" fill="none" stroke="white" stroke-width="2" />
  </g>

  <!-- GraphQL -->
  <g transform="translate(370, 150)">
    <rect width="50" height="50" fill="#E10098" />
    <path d="M25 15 L35 20 L35 30 L25 35 L15 30 L15 20 Z" fill="none" stroke="white" stroke-width="2" />
    <circle cx="25" cy="15" r="2" fill="white" />
    <circle cx="35" cy="25" r="2" fill="white" />
    <circle cx="25" cy="35" r="2" fill="white" />
    <circle cx="15" cy="25" r="2" fill="white" />
  </g>

  <!-- Additional Labels -->
  <text x="35" y="215" text-anchor="middle">BLoC</text>
  <text x="95" y="215" text-anchor="middle">Cubit</text>
  <text x="155" y="215" text-anchor="middle">Riverpod</text>
  <text x="215" y="215" text-anchor="middle">Supabase</text>
  <text x="275" y="215" text-anchor="middle">Hive</text>
  <text x="335" y="215" text-anchor="middle">Retrofit</text>
  <text x="395" y="215" text-anchor="middle">GraphQL</text>
</svg>
