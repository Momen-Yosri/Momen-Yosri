    <path d="M20 25 C20 22, 22 20, 25 20 C28 20, 30 22, 30 25 C30 28, 28 30, 25 30 C22 30, 20 28, 20 25 Z" fill="white" />
    <path d="M15 15 L35 15 L35 35 L15 35 Z" fill="none" stroke="white" stroke-width="2" />
